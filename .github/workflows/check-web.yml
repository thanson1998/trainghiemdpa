name: DPA web health
on:
  push:
    paths:
      - '.github/workflows/check-web.yml'
      - '*.ts'
      - '*.tsx'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify current POS, history route and published assets
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://trainghiemdpa.thanson198.workers.dev';
          const pages='https://thanson1998.github.io/trainghiemdpa/';
          let html;
          for(let attempt=0;attempt<30;attempt++){
            try{
              const page=await fetch(pages+'?health='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
              html=await page.text();
              // Business routes must reject anonymous access without reading customer data.
              const route=await fetch(base+'/api/order-history?from=invalid&to=invalid',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(page.ok&&html.includes('name="dpa-release" content="owner-auth-v1"')&&route.status===401&&route.headers.get('x-dpa-ops')==='owner-auth-v1')break;
              if(attempt===29)throw Error('Current deployment is not ready.');
            }catch(e){if(attempt===29)throw e;}
            await new Promise(resolve=>setTimeout(resolve,6000));
          }
          const report={};
          for(const [label,url] of [['catalog',base+'/api/catalog'],['layout',base+'/api/table-layout'],['images',base+'/api/dish-images'],['backups',base+'/api/backups'],['bank',base+'/api/pos/bank'],['shifts',base+'/api/pos/shift?from=2026-01-01T00%3A00%3A00.000Z&to=2026-01-02T00%3A00%3A00.000Z']]){
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
            if(r.status!==401)throw Error(label+' anonymous access was not blocked: '+r.status);
            const body=await r.json();
            if(Object.keys(body).some(key=>key!=='error'))throw Error(label+' returned private fields');report[label]={anonymousAccess:'blocked'};
          }
          const authResponse=await fetch(base+'/api/auth/status',{signal:AbortSignal.timeout(15000)});
          if(!authResponse.ok)throw Error('Login storage is not ready');
          const auth=await authResponse.json();
          if(!auth.configured&&!auth.setupAvailable&&!auth.googleClientId)throw Error('Configure the owner Google login before activation');
          const paths=[...html.matchAll(/(?:src|href)="(\.\/(?:assets\/[^"]+\.(?:js|css)|pos-menu-overview\.(?:js|css)[^"]*))"/g)].map(m=>m[1]);
          if(!paths.length)throw Error('Published application assets are missing.');
          for(const path of paths){
            const r=await fetch(new URL(path,pages),{signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('Missing asset: '+path);
            const body=await r.text();
            if(!body.length||body.trimStart().startsWith('<!doctype'))throw Error('Invalid application asset: '+path);
          }
          console.log(JSON.stringify({ok:true,assets:paths.length,...report}));
          JS
