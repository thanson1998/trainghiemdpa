name: DPA web health
on:
  push:
    paths:
      - '.github/workflows/check-web.yml'
      - 'dish-images-api.ts'
      - 'pos-panel.tsx'
      - 'action-colors.css'
      - 'pos-readability.css'
      - 'page-layout.css'
      - 'dashboard.tsx'
      - 'ads-panel.tsx'
      - 'ads-api.ts'
      - 'pos-tools-api.ts'
      - 'build.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check image progress and page transfer sizes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://trainghiemdpa.thanson198.workers.dev';
          const report={};
          // Check the new deployment rather than a previous release still being replaced.
          for(let attempt=0;attempt<20;attempt++){
            const r=await fetch(base+'/api/dish-images',{cache:'no-store',signal:AbortSignal.timeout(15000)});
            const state=await r.json();
            const page=await fetch('https://thanson1998.github.io/trainghiemdpa/',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            const html=await page.text();
            const adsReady=await fetch(base+'/api/ads-research',{cache:'no-store',signal:AbortSignal.timeout(15000)});
            const adsState=await adsReady.json();
            const connectionResponse=await fetch(base+'/api/ads-connection?setup=public');
            const connection=await connectionResponse.json();
            if(state.retryPolicy==='continuous-v1'&&html.includes('ads-live-v3')&&adsReady.ok&&Array.isArray(adsState.venues)&&connectionResponse.ok&&connection.apiVersion==='search-v3')break;
            if(attempt===19)throw new Error('Deployment did not become ready within the health-check window.');
            await new Promise(resolve=>setTimeout(resolve,6000));
          }
          const adsResponse=await fetch(base+'/api/ads-research');
          const ads=await adsResponse.json();
          if(!adsResponse.ok||!Array.isArray(ads.venues))throw new Error('Ads research endpoint unavailable');
          report.ads={status:adsResponse.status,venues:ads.venues.length,samples:ads.samples.length};
          const connectionResponse=await fetch(base+'/api/ads-connection?setup=public');
          const connection=await connectionResponse.json();
          if(!connection.configured)throw new Error('SearchApi has not been configured.');
          const realSearch=await fetch(base+'/api/ads-live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'nhà hàng Thái Nguyên'}),signal:AbortSignal.timeout(65000)});
          const realResult=await realSearch.json();
          console.log(JSON.stringify({liveAdsCheck:{status:realSearch.status,query:realResult.query,total:realResult.total,ads:realResult.ads?.length,pageNames:realResult.ads?.slice(0,8).map(ad=>ad.pageName),error:realResult.error,providerStatus:realResult.providerStatus}}));
          if(!realSearch.ok)throw new Error('Live ads search failed.');
          async function read(label,url,json=false){
            const start=performance.now();
            const r=await fetch(url,{signal:AbortSignal.timeout(45000)});
            const bytes=await r.arrayBuffer();
            report[label]={status:r.status,ms:Math.round(performance.now()-start),bytes:bytes.byteLength,mime:r.headers.get('content-type'),cache:r.headers.get('cache-control')};
            if((label==='sampleImage'||label==='warmImage')&&(r.status!==200||bytes.byteLength<4||new Uint8Array(bytes)[0]!==255||new Uint8Array(bytes)[1]!==216))throw new Error('Image health check failed.');
            if(label==='pages'){
              const html=new TextDecoder().decode(bytes);
              report.pages.optimized=html.includes('fast-images-v2');
              report.pages.fastPos=html.includes('ads-live-v3');
              const script=html.match(/src="(\.\/assets\/[^\"]+\.js)"/);
              const style=html.match(/href="(\.\/assets\/[^\"]+\.css)"/);
              if(script)await read('initialScript',new URL(script[1],'https://thanson1998.github.io/trainghiemdpa/'));
              if(style)await read('styles',new URL(style[1],'https://thanson1998.github.io/trainghiemdpa/'));
            }
            if(!r.ok)return null;
            return json?JSON.parse(new TextDecoder().decode(bytes)):null;
          }
          try{
            const status=await read('imageStatus',base+'/api/dish-images',true);
            if(status)report.imageProgress={enabled:status.enabled,counts:status.counts,errors:status.errors,resumeAfter:status.resumeAfter,retryPolicy:status.retryPolicy};
            const catalog=await read('catalog',base+'/api/catalog',true);
            if(catalog){
              report.catalogCounts={dishes:catalog.dishes?.length,templates:catalog.templates?.length,withArtwork:catalog.dishes?.filter(d=>d.image?.url).length};
              const sample=catalog.dishes?.find(d=>/^\/api\/dish-images\/[-\da-f]{36}\?v=\d+$/i.test(d.image?.url||''));
              if(sample){await read('sampleImage',base+sample.image.url);await new Promise(resolve=>setTimeout(resolve,500));await read('warmImage',base+sample.image.url);}
            }
            await read('pages','https://thanson1998.github.io/trainghiemdpa/');
            console.log(JSON.stringify(report,null,2));
          }catch{console.log(JSON.stringify({...report,error:'Health check could not complete; no order data was requested.'},null,2));process.exitCode=1;}
          JS
