name: DPA web health
on:
  push:
    paths:
      - '.github/workflows/check-web.yml'
      - 'dish-images-api.ts'
      - 'dish-supplemental.ts'
      - 'dish-thumbnail.tsx'
      - 'pos-panel.tsx'
      - 'action-colors.css'
      - 'pos-readability.css'
      - 'page-layout.css'
      - 'dashboard.tsx'
      - 'market-panel.tsx'
      - 'market-live-panel.tsx'
      - 'market-boundary.tsx'
      - 'market-proposal.ts'
      - 'market-proposal-card.tsx'
      - 'ads-api.ts'
      - 'pos-tools-api.ts'
      - 'build.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check image progress and page transfer sizes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://trainghiemdpa.thanson198.workers.dev';
          const report={};
          // Check the new deployment rather than a previous release still being replaced.
          for(let attempt=0;attempt<20;attempt++){
            const r=await fetch(base+'/api/dish-images',{cache:'no-store',signal:AbortSignal.timeout(15000)});
            const state=await r.json();
            const page=await fetch('https://thanson1998.github.io/trainghiemdpa/',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            const html=await page.text();
            const adsReady=await fetch(base+'/api/market-research',{cache:'no-store',signal:AbortSignal.timeout(15000)});
            const adsState=await adsReady.json();
            const connectionResponse=await fetch(base+'/api/market-connection?setup=public');
            const connection=await connectionResponse.json();
            if(state.retryPolicy==='continuous-v1'&&html.includes('market-post-v1')&&html.includes('food-art-v3')&&adsReady.ok&&Array.isArray(adsState.venues)&&connectionResponse.ok&&connection.apiVersion==='search-v5'&&state.artwork?.total>=155)break;
            if(attempt===19)throw new Error('Deployment did not become ready within the health-check window.');
            await new Promise(resolve=>setTimeout(resolve,6000));
          }
          const adsResponse=await fetch(base+'/api/market-research');
          const ads=await adsResponse.json();
          if(!adsResponse.ok||!Array.isArray(ads.venues))throw new Error('Ads research endpoint unavailable');
          report.ads={status:adsResponse.status,venues:ads.venues.length,samples:ads.samples.length};
          const connectionResponse=await fetch(base+'/api/market-connection?setup=public');
          const connection=await connectionResponse.json();
          if(!connection.configured)throw new Error('SearchApi has not been configured.');
          const realSearch=await fetch(base+'/api/market-feed',{signal:AbortSignal.timeout(15000)});
          const realFeed=await realSearch.json();
          const result=realFeed.searches?.find(s=>s.ads?.length)||realFeed.searches?.[0];
          console.log(JSON.stringify({liveAdsCheck:{status:realSearch.status,ads:result?.ads?.length,pageNames:result?.ads?.map(ad=>ad.pageName)}}));
          if(!realSearch.ok||!Array.isArray(realFeed.searches))throw new Error('Live ads feed unavailable.');
          async function read(label,url,json=false){
            const start=performance.now();
            const r=await fetch(url,{signal:AbortSignal.timeout(45000)});
            const bytes=await r.arrayBuffer();
            report[label]={status:r.status,ms:Math.round(performance.now()-start),bytes:bytes.byteLength,mime:r.headers.get('content-type'),cache:r.headers.get('cache-control')};
            if((label==='sampleImage'||label==='warmImage')&&(r.status!==200||bytes.byteLength<4||new Uint8Array(bytes)[0]!==255||new Uint8Array(bytes)[1]!==216))throw new Error('Image health check failed.');
            if(label==='pages'){
              const html=new TextDecoder().decode(bytes);
              report.pages.optimized=html.includes('fast-images-v2');
              report.pages.fastPos=html.includes('market-post-v1');
              const script=html.match(/src="(\.\/assets\/[^\"]+\.js)"/);
              const style=html.match(/href="(\.\/assets\/[^\"]+\.css)"/);
              if(script)await read('initialScript',new URL(script[1],'https://thanson1998.github.io/trainghiemdpa/'));
              if(style)await read('styles',new URL(style[1],'https://thanson1998.github.io/trainghiemdpa/'));
            }
            if(label==='initialScript'){
              const js=new TextDecoder().decode(bytes);
              const module=js.match(/market-panel-[\w-]+\.js/);
              if(!module)throw new Error('Research module not linked.');
              await read('marketModule',new URL('./assets/'+module[0],'https://thanson1998.github.io/trainghiemdpa/'));
            }
            if(label==='marketModule'&&(!r.ok||!new TextDecoder().decode(bytes).includes('dpa-market-post-')))throw new Error('Suggested post module not available.');
            if(label.startsWith('chatgptArtwork')&&(!r.ok||new Uint8Array(bytes)[0]!==82||new Uint8Array(bytes)[8]!==87))throw new Error('ChatGPT food artwork unavailable.');
            if(!r.ok)return null;
            return json?JSON.parse(new TextDecoder().decode(bytes)):null;
          }
          try{
            const status=await read('imageStatus',base+'/api/dish-images',true);
            if(status)report.imageProgress={enabled:status.enabled,counts:status.counts,errors:status.errors,resumeAfter:status.resumeAfter,retryPolicy:status.retryPolicy,artwork:status.artwork};
            const catalog=await read('catalog',base+'/api/catalog',true);
            if(catalog){
              report.catalogCounts={dishes:catalog.dishes?.length,templates:catalog.templates?.length,withArtwork:catalog.dishes?.filter(d=>d.image?.url).length};
              const sample=catalog.dishes?.find(d=>/^\/api\/dish-images\/[-\da-f]{36}\?v=\d+$/i.test(d.image?.url||''));
              if(sample){await read('sampleImage',base+sample.image.url);await new Promise(resolve=>setTimeout(resolve,500));await read('warmImage',base+sample.image.url);}
            }
            await read('chatgptArtwork','https://thanson1998.github.io/trainghiemdpa/assets/dish-art-extra-20261025-CymtCjVZ.webp');
            await read('chatgptArtwork2','https://thanson1998.github.io/trainghiemdpa/assets/dish-art-batch-2-20261025-BxNasIxo.webp');
            await read('chatgptArtwork3','https://thanson1998.github.io/trainghiemdpa/assets/dish-art-batch-3-20261025-DDhZEfos.webp');
            await read('chatgptArtwork4','https://thanson1998.github.io/trainghiemdpa/assets/dish-art-batch-4-20261025-C68CcuqT.webp');
            await read('chatgptArtwork5','https://thanson1998.github.io/trainghiemdpa/assets/dish-art-batch-5-20261025-BRxvZDcx.webp');
            await read('pages','https://thanson1998.github.io/trainghiemdpa/');
            console.log(JSON.stringify(report,null,2));
          }catch{console.log(JSON.stringify({...report,error:'Health check could not complete; no order data was requested.'},null,2));process.exitCode=1;}
          JS
