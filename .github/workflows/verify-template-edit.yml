name: Verify template editor deployment
on:
  push:
    paths:
      - 'menu.ts'
      - 'menu-editor.tsx'
      - 'catalog-api.ts'
      - '.github/workflows/verify-template-edit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check deployed template fix without changing live data
        run: |
          node --input-type=module <<'JS'
          const base='https://trainghiemdpa.thanson198.workers.dev';
          for(let attempt=0;attempt<35;attempt++){
            try{
              const r=await fetch(base+'/api/catalog',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(r.status!==401||r.headers.get('X-DPA-Ops')!=='owner-auth-v2')throw Error('Template fix is not deployed yet');
              const manifest=await fetch('https://raw.githubusercontent.com/'+process.env.GITHUB_REPOSITORY+'/'+process.env.GITHUB_SHA+'/index.html',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(!manifest.ok)throw Error('Current build manifest is not available');
              const expected=await manifest.text(),stylesheet=expected.match(/href="(\.\/kitchen-print-layout\.css[^"]*)"/)?.[1];
              if(!stylesheet)throw Error('Kitchen print stylesheet is missing from the build');
              const page=await fetch('https://thanson1998.github.io/trainghiemdpa/?template='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
              const html=await page.text();if(!page.ok||!html.includes(stylesheet))throw Error('Current kitchen print layout is not deployed yet');
              console.log('Verified live template-save fix and compact kitchen-print stylesheet.');break;
            }catch(error){if(attempt===34)throw error;await new Promise(resolve=>setTimeout(resolve,12000));}
          }
          JS
