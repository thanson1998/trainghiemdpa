name: Verify booking time and printed tables
on:
  push:
    paths:
      - 'booking-time-defaults.js'
      - 'kitchen-print-layout.js'
      - 'print-menu.tsx'
      - '0022_hotpot_1420000.sql'
      - '.github/workflows/verify-booking-time.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify form and print assets on both public hosts
        run: |
          node --input-type=module <<'JS'
          const hosts=['https://thanson1998.github.io/trainghiemdpa/','https://trainghiemdpa.thanson198.workers.dev/'];
          for(let attempt=0;attempt<35;attempt++){
            try{
              for(const host of hosts){
                const r=await fetch(host+'?layout=20261030-3',{cache:'no-store',signal:AbortSignal.timeout(15000)});
                const html=await r.text();
                if(!r.ok||!html.includes('booking-time-defaults.js?v=20261104-edit-time')||!html.includes('kitchen-print-layout.css?v=20261104-set-labels')||!html.includes('kitchen-print-layout.js?v=20261104-set-labels'))throw Error('Updated form and print layout not ready');
                for(const [path,marker] of [['booking-time-defaults.js?v=20261104-edit-time','h*60+m+180'],['kitchen-print-layout.js?v=20261104-set-labels','menu-print-table-lines'],['kitchen-print-layout.css?v=20261104-set-labels','31mm']]){
                  const asset=await fetch(host+path,{signal:AbortSignal.timeout(15000)});
                  if(!asset.ok||!(await asset.text()).includes(marker))throw Error('Updated asset not ready: '+path);
                }
              }
              const response=await fetch('https://trainghiemdpa.thanson198.workers.dev/api/bookings?date=invalid',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(response.status!==401||response.headers.get('X-DPA-Ops')!=='owner-auth-v1')throw Error('Portable table number API is not ready');
              console.log('Verified: automatic end time, editable time fields and portable table number API on both hosts.');break;
            }catch(error){if(attempt===34)throw error;await new Promise(resolve=>setTimeout(resolve,12000));}
          }
          JS
