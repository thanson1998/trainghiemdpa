name: Verify compact POS ticket editor
on:
  push:
    paths:
      - 'pos-ticket-edit.js'
      - 'pos-ticket-edit.css'
      - 'pos-ticket-fields.tsx'
      - 'pos-panel.tsx'
      - '.github/workflows/verify-pos-ticket-edit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for current form assets on both hosts
        run: |
          node --input-type=module <<'JS'
          for(let attempt=0;attempt<35;attempt++){
            try{
              const expectedResponse=await fetch('https://raw.githubusercontent.com/'+process.env.GITHUB_REPOSITORY+'/'+process.env.GITHUB_SHA+'/index.html',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(!expectedResponse.ok)throw Error('Expected build manifest is not available');
              const expectedHtml=await expectedResponse.text(),expectedRelease=expectedHtml.match(/<meta name="dpa-release" content="([^"]+)"\s*\/>/)?.[1];
              if(!expectedRelease)throw Error('Expected release marker is missing');
              for(const host of ['https://thanson1998.github.io/trainghiemdpa/','https://trainghiemdpa.thanson198.workers.dev/']){
                const r=await fetch(host+'?ticket='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                const html=await r.text();
                if(!r.ok||!html.includes('name="dpa-release" content="'+expectedRelease+'"')||!html.includes('pos-ticket-edit.js?v=20261030-12')||!html.includes('pos-ticket-edit.css?v=20261104-end-table')||!html.includes('booking-time-defaults.js?v=20261104-edit-time'))throw Error('Current form is not ready');
              }
              break;
            }catch(error){if(attempt===34)throw error;await new Promise(resolve=>setTimeout(resolve,12000));}
          }
          JS
      - name: Prepare browser checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the anonymous login screen without credentials or live writes
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try{
            for(const host of ['https://thanson1998.github.io/trainghiemdpa/','https://trainghiemdpa.thanson198.workers.dev/']){
              const context=await browser.newContext({locale:'vi-VN',timezoneId:'Asia/Ho_Chi_Minh',viewport:{width:1440,height:1000}}),page=await context.newPage();
              const errors=[];page.on('pageerror',error=>errors.push(error.message));
              await page.goto(host+'?login='+process.env.GITHUB_SHA,{waitUntil:'domcontentloaded'});
              const login=page.locator('.owner-login-card');await login.waitFor({timeout:30000});
              await page.waitForFunction(()=>!document.querySelector('.owner-login-card h1')?.textContent.includes('Đang kết nối'));
              assert.equal(await page.locator('.app-shell,.pos-panel').count(),0,'private screens must stay unmounted');
              assert.equal(await login.locator('h1').count(),1);assert.equal(await login.locator('button').count()>0,true);
              for(const width of [1440,390,320]){await page.setViewportSize({width,height:900});assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),'login must fit the viewport');}
              assert.deepEqual(errors,[]);await context.close();
            }
            console.log('Verified owner login wall on both hosts at desktop and phone widths. No live sign-in or business writes.');
          }finally{await browser.close();}
          JS
